name: tauri-desktop

on:
  push:
    branches: [main]
    paths:
      - "tauri-desktop/**"
      - "crates/trace-commons-contributor/**"
      - "crates/trace-commons-protocol/**"
      - "Cargo.lock"
      - ".github/workflows/tauri-desktop.yml"
  pull_request:
    paths:
      - "tauri-desktop/**"
      - "crates/trace-commons-contributor/**"
      - "crates/trace-commons-protocol/**"
      - "Cargo.lock"
      - ".github/workflows/tauri-desktop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tauri-desktop/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build-storybook

  rust:
    name: Rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config \
            wget
      - name: Check formatting
        run: cargo fmt --manifest-path tauri-desktop/src-tauri/Cargo.toml -- --check
      - name: Compile Tauri shell
        run: cargo check --locked --manifest-path tauri-desktop/src-tauri/Cargo.toml
      - name: Test Tauri shell
        run: cargo test --locked --manifest-path tauri-desktop/src-tauri/Cargo.toml
